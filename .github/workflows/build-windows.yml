name: Build Windows .exe

# Builds a genuine Windows executable on Microsoft's hosted runners and
# uploads it as a downloadable artifact (and as a Release asset when a tag
# or published Release triggers the run).
#
# Manual run:  Actions -> "Build Windows .exe" -> Run workflow
# Release:     git tag v1.0.0 && git push origin v1.0.0
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string for the file names"
        default: "1.0.0"
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build on windows-latest
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.0"

      # ---------------------------------------------------------------- portable
      # Produces dist\TypeFlow.exe (the installer needs this exact file name).
      - name: Build portable .exe (PyInstaller)
        run: |
          pyinstaller --noconfirm --clean `
            --onefile `
            --windowed `
            --name TypeFlow `
            --icon assets\icon.ico `
            --add-data "typing_app\data\lessons.json;typing_app\data" `
            --add-data "assets\icon.ico;assets" `
            --hidden-import PyQt6.QtMultimedia `
            run.py

      # ----------------------------------------------------------------- installer
      # Must run before the portable build is renamed.
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if (-not $version) { $version = "1.0.0" }
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "::warning::Inno Setup not found - skipping the installer."
            exit 0
          }
          & $iscc "installer\TypeFlow.iss" "/DMyAppVersion=$version"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Inno Setup failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          Write-Host "Installer built: installer\Output\TypeFlowSetup-$version.exe"

      - name: Rename portable build
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if (-not $version) { $version = "1.0.0" }
          Rename-Item -Path dist\TypeFlow.exe -NewName "TypeFlow-$version-portable.exe"
          Write-Host "Built TypeFlow-$version-portable.exe"

      - name: List build output
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Include *.exe dist, installer\Output |
            ForEach-Object { "{0}  ({1:N1} MB)" -f $_.FullName, ($_.Length / 1MB) }

      # ------------------------------------------------------------------ artifacts
      - name: Upload portable .exe
        uses: actions/upload-artifact@v4
        with:
          name: TypeFlow-${{ inputs.version || '1.0.0' }}-portable
          path: dist/*.exe
          retention-days: 90
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: TypeFlow-${{ inputs.version || '1.0.0' }}-installer
          path: installer/Output/*.exe
          retention-days: 90
          if-no-files-found: warn

      # ------------------------------------------------------- attach to a Release
      - name: Attach files to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            installer/Output/*.exe
          fail_on_unmatched_files: false
